<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · PCE Campus Voice</title>
    <meta name="description" content="Private review site for Poornima College of Engineering students." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <main class="auth-shell" id="main">
      <div class="auth-card">
        <div class="auth-card__head">
          <h1>PCE Campus Voice</h1>
          <p>
            Sign in with your college email. This site is private to students of Poornima College of
            Engineering.
          </p>
        </div>

        <div class="form-alert" id="alert" role="alert"></div>

        <form id="login-form" novalidate>
          <div class="field">
            <label class="field__label" for="email">College email</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="username"
              required
              spellcheck="false"
            />
            <span class="field__error" id="email-error" role="alert"></span>
          </div>

          <div class="field">
            <label class="field__label" for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              required
            />
            <span class="field__error" id="password-error" role="alert"></span>
          </div>

          <div class="btn-row">
            <button class="btn" type="submit" id="submit">Sign in</button>
            <a class="btn btn--ghost" href="/register">Create an account</a>
          </div>
        </form>

        <p class="caption muted" id="forgot-note">
          Forgot your password? There is no email server here, so ask the campus admin to reset it for
          you from the admin page.
        </p>
      </div>
    </main>

    <script type="module" src="/js/login.js"></script>
  </body>
</html>
