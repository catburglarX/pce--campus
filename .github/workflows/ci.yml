name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Bun ${{ matrix.bun }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        bun: ["1.4.2"]
        full: [true]
        include:
          # Oldest supported runtime, per "engines" in package.json. Bun 1.3 cannot read the
          # lockfile v2 format written by 1.4, so this job verifies the runtime claim instead:
          # the application and its tests run with nothing installed.
          - os: ubuntu-latest
            bun: "1.3.13"
            full: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: Install dev dependencies
        if: matrix.full
        run: bun install --frozen-lockfile

      - name: Type check
        if: matrix.full
        run: bun x tsc --noEmit

      - name: Unit and integration tests
        run: bun test

      - name: End-to-end smoke test
        run: bun run scripts/smoke.ts
